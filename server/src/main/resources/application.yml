server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: qivo-server
  profiles:
    active: dev

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: ${qivo.datasource.driver-class-name}
    url: jdbc:mysql://${qivo.datasource.host}:${qivo.datasource.port}/${qivo.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${qivo.datasource.username}
    password: ${qivo.datasource.password}
    hikari:
      pool-name: QivoPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  flyway:
    enabled: ${qivo.flyway.enabled}
    baseline-on-migrate: false
    clean-disabled: true

  # Redis
  data:
    redis:
      timeout: 1s
      host: ${qivo.redis.host}
      port: ${qivo.redis.port}
      password: ${qivo.redis.password}
      database: 2
      repositories:
        enabled: false
      lettuce:
        shutdown-timeout: 100
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000

  # 文件上传
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

# MyBatis
mybatis-plus:
  global-config:
    banner: false
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.qivo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT
jwt:
  secret: ${qivo.jwt.secret}
  expiration: 604800000
  header: Authorization
  prefix: Bearer

# 文件上传路径
qivo:
  upload:
    path: ${qivo.upload.path}
    allow-types: jpg,jpeg,png,gif,webp

springdoc:
  swagger-ui:
    enabled: ${qivo.swagger-ui.enabled}
    path: /swagger-ui.html
  api-docs:
    enabled: ${qivo.api-docs.enabled}
    path: /v3/api-docs

logging:
  level:
    com.qivo: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
